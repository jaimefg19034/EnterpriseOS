name: Retry failed Pages deployment

on:
  workflow_run:
    workflows: ["Deploy static site to GitHub Pages", "Quality checks"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.run_attempt < 2 }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Retry the failed workflow once
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            core.warning(`${run.name} run ${run.id} failed. Starting its one permitted retry (attempt ${run.run_attempt + 1}).`);
            await github.rest.actions.reRunWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
            });
