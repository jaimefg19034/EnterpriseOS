name: Deploy strategic advisor function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/strategic-advisor/**"
      - ".github/workflows/deploy-strategic-advisor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.SUPABASE_PROJECT_REF != '' || vars.NEXT_PUBLIC_SUPABASE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy edge function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          PROJECT_REF="$SUPABASE_PROJECT_REF"
          if [ -z "$PROJECT_REF" ] && [ -n "$SUPABASE_URL" ]; then
            PROJECT_REF="$(printf '%s' "$SUPABASE_URL" | sed -E 's#https?://([^.]+)\\.supabase\\.co.*#\\1#')"
          fi
          if [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$OPENAI_API_KEY" ]; then
            echo "::notice::Set SUPABASE_PROJECT_REF (or NEXT_PUBLIC_SUPABASE_URL), SUPABASE_ACCESS_TOKEN and OPENAI_API_KEY to enable deployment."
            exit 0
          fi
          supabase functions deploy strategic-advisor --project-ref "$PROJECT_REF"
          if [ -n "$OPENAI_MODEL" ]; then
            supabase secrets set "OPENAI_API_KEY=$OPENAI_API_KEY" "OPENAI_MODEL=$OPENAI_MODEL" --project-ref "$PROJECT_REF"
          else
            supabase secrets set "OPENAI_API_KEY=$OPENAI_API_KEY" --project-ref "$PROJECT_REF"
          fi
