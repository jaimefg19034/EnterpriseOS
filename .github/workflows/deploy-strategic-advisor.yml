name: Deploy strategic advisor function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/strategic-advisor/**"
      - ".github/workflows/deploy-strategic-advisor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && vars.SUPABASE_PROJECT_REF != '' && secrets.OPENAI_API_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy edge function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          supabase functions deploy strategic-advisor --project-ref "$SUPABASE_PROJECT_REF"
          if [ -n "$OPENAI_MODEL" ]; then
            supabase secrets set "OPENAI_API_KEY=$OPENAI_API_KEY" "OPENAI_MODEL=$OPENAI_MODEL" --project-ref "$SUPABASE_PROJECT_REF"
          else
            supabase secrets set "OPENAI_API_KEY=$OPENAI_API_KEY" --project-ref "$SUPABASE_PROJECT_REF"
          fi
